# 목적: 지원 macOS의 빌드·테스트·앱 패키징 호환성 검증
# 이용처: PR과 main 변경의 SDK별 회귀 검사
# 사용방법: GitHub Actions 자동 실행 또는 workflow_dispatch 수동 실행
name: macOS compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} / Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            xcode: '16.2'
          - os: macos-15
            xcode: '16.3'
          - os: macos-26
            xcode: '26.5'
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Report OS, toolchain and SDK
        run: |
          sw_vers
          swift --version
          xcrun --show-sdk-version
      - name: Run tests
        run: swift test
      - name: Package and verify release app
        run: |
          scripts/package_app.sh --output "$RUNNER_TEMP/CodexQuotaChecker.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/CodexQuotaChecker.app"
          test "$(plutil -extract LSMinimumSystemVersion raw "$RUNNER_TEMP/CodexQuotaChecker.app/Contents/Info.plist")" = '14.0'
          xcrun vtool -show-build "$RUNNER_TEMP/CodexQuotaChecker.app/Contents/MacOS/CodexQuotaMonitor"
      - name: Verify app startup
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import signal
          import subprocess
          import time

          app = os.path.join(os.environ['RUNNER_TEMP'], 'CodexQuotaChecker.app')
          executable = os.path.join(app, 'Contents/MacOS/CodexQuotaMonitor')
          subprocess.run(['open', '-n', app], check=True)
          time.sleep(5)
          result = subprocess.run(['pgrep', '-f', '^' + re.escape(executable) + '$'], capture_output=True, text=True)
          if result.returncode != 0:
              reports = sorted((Path.home() / 'Library/Logs/DiagnosticReports').glob('CodexQuotaMonitor*.ips'))
              for report in reports[-2:]:
                  print(report.read_text(errors='replace')[:20000])
              raise SystemExit('App is not running after launch through LaunchServices')
          for pid in result.stdout.split():
              os.kill(int(pid), signal.SIGTERM)
          PY
